components:
  schemas:
    AcademicDirectory:
      type: object
      properties:
        count:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/AcademicStandingRow'
      required:
      - count
      - limit
      - offset
      - results
    AcademicFilters:
      type: object
      properties:
        disciplines:
          type: array
          items:
            type: string
        batch_years:
          type: array
          items:
            type: integer
        programmes:
          type: array
          items:
            type: string
      required:
      - batch_years
      - disciplines
      - programmes
    AcademicStandingRow:
      type: object
      description: |-
        One row of the CPI directory. `cpi` is null when nothing is declared —
        never zero.
      properties:
        user_id:
          type: integer
        roll_no:
          type: string
        name:
          type: string
        programme:
          type: string
        discipline:
          type: string
        batch_year:
          type: integer
          nullable: true
        cpi:
          type: string
          nullable: true
        semester:
          type: integer
          nullable: true
        semester_type:
          type: string
          nullable: true
        declared_seq:
          type: integer
          nullable: true
        earned_credits:
          type: string
          nullable: true
        active_backlogs:
          type: integer
          nullable: true
      required:
      - active_backlogs
      - batch_year
      - cpi
      - declared_seq
      - discipline
      - earned_credits
      - name
      - programme
      - roll_no
      - semester
      - semester_type
      - user_id
    ActionInput:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/ElmLeaveActionKind'
        reason:
          type: string
          default: ''
          maxLength: 2000
        requested_end_date:
          type: string
          format: date
          nullable: true
        actual_resumption_date:
          type: string
          format: date
          nullable: true
        substitute_user_id:
          type: integer
          minimum: 1
          nullable: true
        medical_evidence_reference:
          type: string
          default: ''
          maxLength: 300
      required:
      - kind
    ActionRequest:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        application_id:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/ElmLeaveActionKind'
          readOnly: true
        requested_end_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        actual_resumption_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        days:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
          readOnly: true
        reason:
          type: string
          readOnly: true
        medical_evidence_reference:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ActionRequestStatusEnum'
          readOnly: true
        submitted_by_user_id:
          type: integer
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actual_resumption_date
      - application_id
      - created_at
      - days
      - id
      - kind
      - medical_evidence_reference
      - reason
      - requested_end_date
      - status
      - submitted_at
      - submitted_by_user_id
    ActionRequestStatusEnum:
      enum:
      - awaiting_substitute
      - applicant_action_required
      - pending_approval
      - approved
      - rejected
      - withdrawn
      type: string
      description: |-
        * `awaiting_substitute` - Awaiting substitute
        * `applicant_action_required` - Applicant action required
        * `pending_approval` - Pending approval
        * `approved` - Approved
        * `rejected` - Rejected
        * `withdrawn` - Withdrawn
    AddCandidates:
      type: object
      properties:
        application_ids:
          type: array
          items:
            type: integer
          maxItems: 500
          minItems: 1
      required:
      - application_ids
    Announcement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        body:
          type: string
          readOnly: true
        topic:
          allOf:
          - $ref: '#/components/schemas/TopicEnum'
          readOnly: true
        audience:
          allOf:
          - $ref: '#/components/schemas/AudienceEnum'
          readOnly: true
        placement_year:
          type: string
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        published_by_role:
          type: string
          readOnly: true
        is_withdrawn:
          type: boolean
          readOnly: true
        withdrawn_reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - audience
      - body
      - created_at
      - id
      - is_withdrawn
      - placement_year
      - published_at
      - published_by_role
      - title
      - topic
      - withdrawn_reason
    Application:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        posting:
          allOf:
          - $ref: '#/components/schemas/JobPosting'
          readOnly: true
        user_id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
        cpi_at_apply:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        semester_at_apply:
          type: integer
          readOnly: true
          nullable: true
        eligibility_snapshot:
          readOnly: true
        cover_note:
          type: string
          readOnly: true
        applied_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        withdrawn_reason:
          type: string
          readOnly: true
        allowed_transitions:
          type: array
          items:
            type: string
          readOnly: true
        candidate:
          type: object
          additionalProperties: {}
          nullable: true
          description: |-
            Populated only when the view batch-loaded the directory, i.e. when
            the reader is staff. A student's own list needs no directory call.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - allowed_transitions
      - applied_at
      - candidate
      - cover_note
      - cpi_at_apply
      - created_at
      - eligibility_snapshot
      - id
      - posting
      - semester_at_apply
      - status
      - user_id
      - withdrawn_reason
    ApplicationStatusEnum:
      enum:
      - draft
      - submitted
      - under_review
      - shortlisted
      - interview_scheduled
      - selected
      - rejected
      - withdrawn
      - auto_withdrawn
      - offer_issued
      - offer_accepted
      - offer_declined
      - offer_expired
      type: string
      description: |-
        * `draft` - Draft
        * `submitted` - Submitted
        * `under_review` - Under review
        * `shortlisted` - Shortlisted
        * `interview_scheduled` - Interview scheduled
        * `selected` - Selected
        * `rejected` - Rejected
        * `withdrawn` - Withdrawn
        * `auto_withdrawn` - Withdrawn automatically
        * `offer_issued` - Offer issued
        * `offer_accepted` - Offer accepted
        * `offer_declined` - Offer declined
        * `offer_expired` - Offer expired
    Apply:
      type: object
      properties:
        posting_id:
          type: integer
        cover_note:
          type: string
          default: ''
          maxLength: 4000
        resume_id:
          type: integer
          nullable: true
      required:
      - posting_id
    ApplyInput:
      type: object
      properties:
        leave_type_id:
          type: integer
          minimum: 1
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        day_part:
          allOf:
          - $ref: '#/components/schemas/DayPartEnum'
          default: full
        reason:
          type: string
          maxLength: 2000
        station_leave_required:
          type: boolean
          default: false
        station_leave_details:
          type: string
          default: ''
          maxLength: 500
        medical_evidence_reference:
          type: string
          default: ''
          maxLength: 300
        substitute_user_id:
          type: integer
          minimum: 1
          nullable: true
      required:
      - end_date
      - leave_type_id
      - reason
      - start_date
    ApplySanction:
      type: object
      properties:
        season:
          type: string
          maxLength: 12
        user_id:
          type: integer
        sanction:
          $ref: '#/components/schemas/SanctionEnum'
        rule:
          type: string
          maxLength: 4
        reason:
          type: string
          maxLength: 300
      required:
      - reason
      - rule
      - sanction
      - season
      - user_id
    Approval:
      type: object
      properties:
        note:
          type: string
          default: ''
          maxLength: 300
    ApprovalStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - Pending institute approval
        * `approved` - Approved
        * `rejected` - Rejected
    AudienceEnum:
      enum:
      - students
      - registered
      - alumni
      - all
      type: string
      description: |-
        * `students` - All students
        * `registered` - Registered students
        * `alumni` - Alumni
        * `all` - Everyone
    Balance:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        leave_type_code:
          type: string
          readOnly: true
        leave_type_name:
          type: string
          readOnly: true
        year:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        allotted:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
        carried_forward:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
        used:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
        reserved:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
        adjustments:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
        expired:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
        available:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - available
      - id
      - leave_type_code
      - leave_type_name
      - year
    BalanceAdjustmentInput:
      type: object
      properties:
        balance_id:
          type: integer
          minimum: 1
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
        reason:
          type: string
          maxLength: 500
      required:
      - amount
      - balance_id
      - reason
    BulkOutcome:
      type: object
      properties:
        application_id:
          type: integer
        moved:
          type: boolean
        error:
          type: string
        code:
          type: string
      required:
      - application_id
      - code
      - error
      - moved
    BulkResult:
      type: object
      description: |-
        Counts first, then the per-item detail — a partial run must never read
        as a complete one.
      properties:
        moved:
          type: integer
        refused:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/BulkOutcome'
      required:
      - moved
      - refused
      - results
    BulkTransition:
      type: object
      properties:
        application_ids:
          type: array
          items:
            type: integer
          maxItems: 200
        to_status:
          type: string
          maxLength: 24
        reason:
          type: string
          default: ''
          maxLength: 300
      required:
      - application_ids
      - to_status
    Calendar:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        year:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        name:
          type: string
          maxLength: 120
        status:
          allOf:
          - $ref: '#/components/schemas/CalendarStatusEnum'
          default: draft
        weekly_closed_days: {}
        published_by_user_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        dates:
          type: array
          items:
            $ref: '#/components/schemas/CalendarDate'
          readOnly: true
        vacation_periods:
          type: array
          items:
            $ref: '#/components/schemas/VacationPeriod'
          readOnly: true
      required:
      - dates
